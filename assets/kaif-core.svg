<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-label="Mohamed Kaif animated developer banner — artificial intelligence, full stack, secure systems">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090c13"/>
      <stop offset=".55" stop-color="#0d101a"/>
      <stop offset="1" stop-color="#111422"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff365e"/>
      <stop offset=".55" stop-color="#ff647d"/>
      <stop offset="1" stop-color="#fc3153"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fe4e72" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#fe4e72" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fe4e72" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#c52551" stop-opacity=".23"/>
      <stop offset=".56" stop-color="#a02953" stop-opacity=".10"/>
      <stop offset="1" stop-color="#a02953" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect x="1" y="1" width="1278" height="408" rx="20"/></clipPath>
    <style><![CDATA[
      .sans{font-family: 'Segoe UI',Inter,Arial,sans-serif}
      .mono{font-family:Consolas,'Courier New',monospace}
      .bright{fill:#f5f6fb}
      .muted{fill:#87909e}
      .orbit-spin{transform-origin:1014px 205px;animation:orbitspin 25s linear infinite}
      .orbit-back{transform-origin:1014px 205px;animation:orbitspin 35s linear infinite reverse}
      .pulsed{animation:pulsed 3s ease-in-out infinite}
      .path-flow{stroke-dasharray:10 13;animation:dash 7s linear infinite}
      .cursor{animation:blink 1.2s steps(1,end) infinite}
      .drift{animation:drift 5s ease-in-out infinite}
      .shine{animation:shine 6s ease-in-out infinite}
      @keyframes orbitspin {to{transform:rotate(360deg)}}
      @keyframes pulsed {0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes dash {to{stroke-dashoffset:-138}}
      @keyframes blink {50%{opacity:0}}
      @keyframes drift {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes shine {0%,100%{opacity:.15}50%{opacity:.65}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    ]]></style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="410" fill="url(#base)"/>
    <rect width="1280" height="410" fill="url(#microGrid)"/>
    <circle cx="1014" cy="205" r="295" fill="url(#halo)"/>
    <path d="M0 0H1280" stroke="#ff617b" stroke-opacity=".5" stroke-width="2"/>
    <path d="M0 409H1280" stroke="#ff617b" stroke-opacity=".24" stroke-width="2"/>
    <path d="M819 28V382" stroke="#fff" stroke-opacity=".10" stroke-dasharray="3 10"/>
    <path d="M38 48H200" stroke="#ff4d6a" stroke-opacity=".42" stroke-width="1"/>
    <circle cx="38" cy="48" r="3" fill="#ff496a"/>
    <text x="52" y="43" font-size="13" letter-spacing="3" font-weight="700" class="mono" fill="#ff687f">KAIF / DEV LAB</text>
    <text x="38" y="112" font-size="12" letter-spacing="2.1" class="mono muted">CREATING THINGS THAT THINK, PROTECT &amp; ADAPT</text>

    <text x="33" y="222" font-size="89" font-weight="800" letter-spacing="-4.8" class="sans bright">MOHAMED</text>
    <text x="35" y="307" font-size="93" font-weight="800" letter-spacing="-4.8" class="sans" fill="url(#ruby)">KAIF<tspan fill="#f5f6fb">.</tspan></text>
    <path d="M39 324H218" stroke="url(#ruby)" stroke-width="3" stroke-linecap="round"/>
    <text x="38" y="354" font-size="15" letter-spacing="2.2" class="mono" fill="#bec5d0">AI / FULL STACK / SECURE SYSTEMS</text>

    <g transform="translate(38 377)">
      <circle cx="6" cy="0" r="5" fill="#ff5472" class="pulsed"/>
      <text x="22" y="5" font-size="11" letter-spacing="1.6" class="mono muted">BUILD  /  DEBUG  /  SHIP</text>
      <rect class="cursor" x="236" y="-9" width="8" height="14" rx="1" fill="#ff647d"/>
    </g>

    <!-- Animated network instrument -->
    <g opacity=".8">
      <path d="M850 81H894M1158 322H1227" stroke="#ff5875" stroke-opacity=".25"/>
      <path d="M851 94H881M1170 309H1227" stroke="#fff" stroke-opacity=".16"/>
      <text x="852" y="75" font-size="11" letter-spacing="2" class="mono muted">NODE_01</text>
      <text x="1158" y="338" font-size="11" letter-spacing="2" class="mono muted">ACTIVE</text>
    </g>
    <g fill="none" transform="translate(1014 205)">
      <circle r="159" stroke="#ff667f" stroke-opacity=".12" stroke-width="1"/>
      <circle r="123" stroke="#ff667f" stroke-opacity=".2" stroke-width="1"/>
      <circle r="88" stroke="#fa5577" stroke-opacity=".34" stroke-width="1"/>
      <circle r="53" stroke="#fa5577" stroke-opacity=".40" stroke-width="1"/>
      <path d="M-172 0H172M0-172V172" stroke="#fff" stroke-opacity=".08"/>
    </g>
    <g class="orbit-spin" transform="translate(1014 205)" fill="none">
      <circle r="145" stroke="url(#orbit)" stroke-width="2.5" stroke-dasharray="93 151 31 637" stroke-linecap="round"/>
      <circle cx="0" cy="-145" r="6" fill="#ff5a78" stroke="none"/>
      <circle cx="0" cy="-145" r="13" stroke="#ff5875" stroke-opacity=".25"/>
    </g>
    <g class="orbit-back" transform="translate(1014 205)" fill="none">
      <circle r="107" stroke="#9c6276" stroke-width="1.5" stroke-opacity=".75" stroke-dasharray="15 20 4 15"/>
      <circle cx="107" cy="0" r="4.5" fill="#ff95a7" stroke="none"/>
    </g>
    <circle cx="1014" cy="205" r="64" fill="#101522" stroke="#fb496a" stroke-opacity=".45"/>
    <circle cx="1014" cy="205" r="57" fill="url(#halo)" class="pulsed"/>
    <g class="drift" font-family="Consolas,'Courier New',monospace" font-weight="700" text-anchor="middle">
      <text x="1014" y="213" font-size="52" letter-spacing="-7" fill="#fff">&lt;/&gt;</text>
    </g>
    <g stroke="#ff5e7e" stroke-width="2" fill="none" class="path-flow">
      <path d="M850 342h46l32-32" opacity=".6"/>
      <path d="M1152 96h-45l-17 19" opacity=".6"/>
    </g>
    <g class="pulsed" fill="#ff6480">
      <circle cx="897" cy="342" r="3"/>
      <circle cx="1153" cy="96" r="3"/>
    </g>
    <g class="mono" font-size="10" letter-spacing="1.5" fill="#8691a2">
      <text x="866" y="370">SIGNAL // 001</text>
      <text x="1139" y="62">MK.OS</text>
    </g>
    <rect x="8" y="8" width="1264" height="394" rx="14" fill="none" stroke="#fff" stroke-opacity=".08"/>
  </g>
</svg>
